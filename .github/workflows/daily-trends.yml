
name: Leonida Intel Daily Trend Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * *"

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run trend engine
        run: python scripts/trend_engine.py

   
     
     
      - name: Save updated trend data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --soft origin/main

          git add data/trends.json data/trend-history.json

          if ! git diff --cached --quiet; then
            git commit -m "Update daily trends"
            git push origin HEAD:main
          fi


