
name: Leonida Intel Daily Trend Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * *"

permissions:
  contents: write

concurrency:
  group: leonida-intel-daily-trends
  cancel-in-progress: false

jobs:
  update-trends:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Run trend engine
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/trend_engine.py



      - name: Save updated trend data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/trends.json data/trend-history.json

          if ! git diff --cached --quiet; then
            git commit -m "Update daily trends"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No trend-data changes to save."
          fi

